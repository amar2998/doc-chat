# PROD (single VM): app + Caddy (automatic HTTPS). Database = MongoDB Atlas (set in .env).
# Run: docker compose -f docker-compose.prod.yml up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      UPLOAD_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    expose: ["3000"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

volumes:
  uploads:
  caddy_data:
  caddy_config:
